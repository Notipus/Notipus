name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checking
        run: uv run mypy app/

      # Two passes: page templates are .html.j2, Cotton components are .html
      # (Cotton resolves <c-name> to cotton/name.html and the extension is fixed).
      - name: Run template linting
        run: |
          uv run djlint app/core/templates --extension=html.j2 --check
          uv run djlint app/core/templates --extension=html.j2 --lint
          uv run djlint app/core/templates --extension=html --check
          uv run djlint app/core/templates --extension=html --lint

      # The CSS bundle itself is built by the docker-build job; this only checks
      # that src/css/tokens.css still matches app/core/design_tokens.py.
      - name: Check design tokens are in sync
        run: uv run python app/manage.py build_design_tokens --check

  # Static analysis with Opengrep (the OSS Semgrep fork). Gating: findings turn
  # this check red and deploy waits on it, so a hit holds up the release. Both
  # the binary and the rule set are pinned, so results only change when we bump
  # them here.
  opengrep:
    name: Opengrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      OPENGREP_VERSION: v1.27.1
      OPENGREP_SHA256: 58053da76672bbeb5b0a5441021c58338707052e10f81d777140ca879bd491ce
      OPENGREP_RULES_REF: f1d2b562b414783763fd02a6ed2736eaed622efa
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Opengrep
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  ${RUNNER_TEMP}/opengrep" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/opengrep"

      # Cloned outside the workspace on purpose: the rule repo ships
      # deliberately vulnerable fixtures, which opengrep would otherwise pick
      # up as scan targets. Sparse checkout keeps it to the languages we ship.
      - name: Fetch Opengrep rules
        run: |
          mkdir -p "${RUNNER_TEMP}/opengrep-rules"
          cd "${RUNNER_TEMP}/opengrep-rules"
          git init -q
          git remote add origin https://github.com/opengrep/opengrep-rules.git
          git sparse-checkout set python dockerfile javascript html generic
          git fetch -q --depth 1 origin "${OPENGREP_RULES_REF}"
          git checkout -q FETCH_HEAD

      # Security rule sets only. The maintainability/best-practice trees were
      # tried first and produced ~75 findings that were all style opinions or
      # false positives (is-function-without-parentheses alone fired 39 times
      # on stdlib and Django @property access) — ruff and mypy already own that
      # ground. generic/nginx/security is out too: its header-redefinition rule
      # found a real bug (see nginx.conf) but then kept firing on the fix, since
      # it cannot tell a re-declared header from a dropped one.
      # --error turns a finding into a red build; .gitignore is honoured by
      # default, so .venv/node_modules/build output are out of scope.
      #
      # Deliberately no --sarif-output here: that flag makes opengrep report
      # (and count) findings that carry a nosemgrep suppression, which would
      # fail the build on every annotated line. The SARIF for code scanning is
      # produced by the separate ungated step below.
      - name: Run Opengrep
        run: |
          "${RUNNER_TEMP}/opengrep" scan \
            --error \
            --config "${RUNNER_TEMP}/opengrep-rules/python/django/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/lang/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/requests/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/cryptography/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/jwt/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/javascript/browser/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/javascript/lang/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/dockerfile/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/html/security" \
            .

      # Second pass purely to produce the SARIF, so the gate above stays a
      # clean pass/fail. No --error: this step reports, it does not judge.
      - name: Generate SARIF
        if: always()
        run: |
          "${RUNNER_TEMP}/opengrep" scan \
            --sarif-output=opengrep.sarif \
            --config "${RUNNER_TEMP}/opengrep-rules/python/django/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/lang/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/requests/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/cryptography/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/python/jwt/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/javascript/browser/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/javascript/lang/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/dockerfile/security" \
            --config "${RUNNER_TEMP}/opengrep-rules/html/security" \
            .

      # Uploaded even when the scan fails, so findings land in the Security tab
      # instead of only the log. Fork PRs get a read-only token and cannot
      # upload, hence continue-on-error.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          sarif_file: opengrep.sarif
          category: opengrep

  # Smoke-test build for every event; runs with a read-only token
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Same GIT_SHA build-arg as docker-publish so a master push's publish
      # job is a full cache hit and ships exactly the image built here
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: notipus:test
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Master only: publish the image deploy will ship. Separate job so the
  # packages:write token never exists in PR runs; the GHA layer cache from
  # docker-build makes this a near-instant rebuild.
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/notipus/notipus:${{ github.sha }}
            ghcr.io/notipus/notipus:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test, opengrep, docker-publish]
    # Only deploy on push to master (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency: deploy-group
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Write fly.toml
        run: printf '%s\n' "$FLY_CONFIG" > fly.toml
        env:
          FLY_CONFIG: ${{ secrets.FLY_CONFIG }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fly machines can only pull private images from registry.fly.io, so
      # mirror the CI-built GHCR image there instead of rebuilding on Fly.
      # Pull from GHCR before `flyctl auth docker` in case the latter
      # rewrites the docker credential config instead of merging into it.
      - name: Mirror image to Fly registry
        run: |
          docker pull ghcr.io/notipus/notipus:${{ github.sha }}
          flyctl auth docker
          docker tag ghcr.io/notipus/notipus:${{ github.sha }} registry.fly.io/notipus:${{ github.sha }}
          docker push registry.fly.io/notipus:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --image registry.fly.io/notipus:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
