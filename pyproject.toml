[project]
name = "notipus"
version = "0.1.0"
description = "A webhook service that sends enriched Shopify, Stripe and Chargify notifications to Slack"
authors = [
    {name = "Viktopia Studio", email = "info@viktopia.io"}
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.17,<6.0.0",
    "requests>=2.34.2,<3.0.0",
    "uvicorn[standard]>=0.52.1",
    "stripe>=15.4.0,<16.0.0",
    "shopifyapi>=12.7.0,<13.0.0",
    "django-allauth>=65.19.0,<66.0.0",
    "webauthn>=3.0.0,<4.0.0",
    "redis>=8.1.0,<9.0.0",
    "whitenoise>=6.12.0",
    "sentry-sdk[django]>=2.66.1",
    "disposable-email-domains>=0.0.237",
    "cryptography>=50.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "tzdata>=2026.3",
    "django-cotton>=2.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.2,<0.17.0",
    "pre-commit>=4.6.1,<5.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pytest-django>=4.13.0,<5.0.0",
    "djlint>=1.44.2,<2.0.0",
    "django-stubs>=5.2.9",
    "django-stubs-ext>=5.0.0",
    "django-extensions>=4.1,<5.0",
    "pytest-env>=1.7.0",
    "pytest-socket>=0.8.0",
]
# Marketing screenshot capture (bin/record_screenshots.sh)
screenshots = [
    "playwright>=1.62.0,<2.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]

[tool.ruff.lint.per-file-ignores]
# Django settings use star imports by convention
"**/settings.py" = ["F401"]  # Allow "imported but unused" for conditional imports
"**/test_settings.py" = ["F403", "F405"]  # Allow star imports in test settings

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["django"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_notipus.test_settings"
pythonpath = ["app"]
testpaths = ["tests"]
# DEBUG=True needed because pytest imports settings.py before test_settings.py
# can override SECRET_KEY, triggering the production security check
env = ["DEBUG=True"]
# "tests_*.py" included because tests/core/* and tests/webhooks/* use that
# prefix; without it those files were silently never collected.
python_files = ["tests.py", "test_*.py", "tests_*.py", "*_tests.py"]
python_classes = ["Test*", "*Test", "*TestCase"]
python_functions = ["test_*"]
addopts = "--strict-markers --disable-socket --allow-unix-socket"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "allow_hosts: allow network connections to specified hosts (pytest-socket)",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
# Django plugin is disabled because the project uses a nested module structure
# (app/ directory with pythonpath configuration) that causes mypy to see models
# under both "app.core.models" and "core.models", triggering duplicate model
# registration errors. To enable full Django type checking:
# 1. Restructure to have a single canonical import path, OR
# 2. Run mypy from within the app/ directory with PYTHONPATH set
# plugins = ["mypy_django_plugin.main"]

# [tool.django-stubs]
# django_settings_module = "django_notipus.test_settings"
# strict_settings = false

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "stripe.*",
    "shopify.*",
    "webauthn.*",
    "allauth.*",
]
ignore_missing_imports = true

[tool.djlint]
profile = "django"
# Page templates are .html.j2; Cotton components under templates/cotton/ must be
# .html because Cotton resolves <c-name> to cotton/name.html. CI lints both by
# passing --extension explicitly for each.
extension = "html.j2"
indent = 4
max_line_length = 120
preserve_blank_lines = true
format_css = true
format_js = true
# H026 flags class="" as a removable empty attribute. On a Cotton <c-vars> tag it
# is not markup at all — it declares a prop's default, and that default has to be
# empty so the prop shadows whatever the surrounding page has in scope.
ignore = "H026"
# Django's own admin templates, which follow admin conventions (entity
# references in breadcrumbs) rather than this project's.
extend_exclude = "app/core/templates/admin"
