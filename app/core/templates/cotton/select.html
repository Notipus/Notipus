{% comment %}
Select, with its label, help and error.

Options are the slot, so callers keep control of values and selected state:

  <c-select name="role" label="Role">
      <option value="admin" selected>Admin</option>
      <option value="user">Member</option>
  </c-select>

Props: name, id, label, help, error, required.
{% endcomment %}
<c-vars name="" id="" label="" help="" error="" required="" class="" />

<c-field :label="label"
         for="{{ id|default:name }}"
         :help="help"
         :error="error"
         :required="required"
         :class="class">
    <select name="{{ name }}"
            id="{{ id|default:name }}"
            class="{% include 'cotton/_input_classes.html' %} pr-8"
            {% if required %}required{% endif %}
            {% if error %}aria-invalid="true" aria-describedby="{{ id|default:name }}-error"{% elif help %}aria-describedby="{{ id|default:name }}-help"{% endif %}
            {{ attrs }}>{{ slot }}</select>
</c-field>
