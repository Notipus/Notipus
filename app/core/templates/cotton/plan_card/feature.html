{% comment %}
One included feature in a <c-plan-card>. The label is the slot.
{% endcomment %}
<c-vars class="" />

<li class="flex items-start gap-2 text-body text-content-muted {{ class }}"
    {{ attrs }}>

       aria-hidden="true"></i>
    <span>{{ slot }}</span>
</li>
