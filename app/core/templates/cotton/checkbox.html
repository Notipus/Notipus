{% comment %}
Checkbox with its label beside it, and optional help text underneath.

Props:
  name, id, value, label, help
  checked   pre-tick the box
  required  required attribute

  <c-checkbox name="events" value="order.paid" label="Order paid"
              help="Fires when a customer completes checkout." checked />
{% endcomment %}
<c-vars name=""
        id=""
        value=""
        label=""
        help=""
        checked=""
        required=""
        class="" />

<div class="flex gap-3 {{ class }}" {{ attrs }}>
    <input type="checkbox"
           name="{{ name }}"
           id="{{ id|default:name }}"
           {% if value %}value="{{ value }}"{% endif %}
           class="mt-0.5 h-4 w-4 flex-shrink-0 rounded border-border-control text-action accent-action focus:outline-none focus:ring-2 focus:ring-focus focus:ring-offset-1"
           {% if checked %}checked{% endif %}
           {% if required %}required{% endif %}
           {% if help %}aria-describedby="{{ id|default:name }}-help"{% endif %}>
    <div class="min-w-0">
        <label for="{{ id|default:name }}"
               class="block text-body font-medium text-content">{{ label }}</label>
        {% if help %}
            <p id="{{ id|default:name }}-help"
               class="mt-0.5 text-body text-content-muted">{{ help }}</p>
        {% endif %}
    </div>
</div>
