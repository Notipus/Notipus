# Notipus Docker Compose Configuration
#
# DEVELOPMENT:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file is for local development. Postgres and Redis are published on
# 127.0.0.1 only and fall back to well-known dev passwords; override them
# with DB_PASSWORD and REDIS_PASSWORD (e.g. in a .env file next to this one).
#
# PRODUCTION: do not run this file as-is. If you base a deployment on it, set
# real values for DB_PASSWORD, REDIS_PASSWORD, SECRET_DJANGO_KEY and
# FIELD_ENCRYPTION_KEYS, set DEBUG=False, and drop the db/redis `ports:`
# entries - the app reaches both over app_network and nothing else needs to.

# YAML Anchors for reusable configurations
x-common-variables: &common-variables
    # Database
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-notipus_dev}
  DB_USER: ${DB_USER:-notipus_user}
  # CodeQL[SM02380]: Development default password - not used in production
  DB_PASSWORD: ${DB_PASSWORD:-dev_password_123}

  # Redis. The password is part of the URL, so it must be URL-safe
  # (letters, digits, - . _ ~) or percent-encoded.
  # CodeQL[SM02380]: Development default password - not used in production
  REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0

  # Django (development defaults)
  # CodeQL[SM02380]: Development default secret - not used in production
  SECRET_DJANGO_KEY: ${SECRET_DJANGO_KEY:-django-dev-key-not-for-production-use}
  DEBUG: ${DEBUG:-True}
  # Encryption at rest for tenant credentials: comma-separated base64url
  # 32-byte keys (ChaCha20-Poly1305), first = primary. REQUIRED when
  # DEBUG=False; in dev a key is derived from SECRET_DJANGO_KEY when unset.
  # Generate: python -c "import os,base64;
  #   print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  # See README "Security: encryption at rest".
  FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django,notipus_django}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  # Peers whose X-Forwarded-* headers uvicorn trusts. The image defaults to
  # "*" for Fly.io (see Dockerfile); here only a proxy on the same host is.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  # Capture raw webhook bodies (7-day Redis retention) for debugging.
  LOG_WEBHOOKS: ${LOG_WEBHOOKS:-False}
  # Public URL of this instance. Providers build their webhook callbacks
  # from it, so when testing through a tunnel set it to the tunnel host.
  BASE_URL: ${BASE_URL:-http://localhost:8000}

  # Global Authentication (Notipus's OAuth apps)
  # These are for app-level OAuth, not tenant-specific configurations
  # CodeQL[SM02380]: Development placeholders - not real credentials
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-your_slack_auth_client_id}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-your_slack_auth_client_secret}
  SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-http://localhost/accounts/slack/login/callback/}
  SLACK_CONNECT_REDIRECT_URI: ${SLACK_CONNECT_REDIRECT_URI:-http://localhost/api/connect/slack/callback/}
  SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-your_shopify_auth_client_id}
  SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-your_shopify_auth_client_secret}
  SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-http://localhost/api/connect/shopify/callback/}
  SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-}

  # Global Billing (Notipus's revenue) - These are for our own billing, not customer payments
  # CodeQL[SM02380]: Development test keys - not real billing credentials
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_notipus_billing_key}
  NOTIPUS_STRIPE_WEBHOOK_SECRET: ${NOTIPUS_STRIPE_WEBHOOK_SECRET:-whsec_notipus_billing_secret}

  # External Services
  # CodeQL[SM02380]: Development API key - not real external service credential
  BRANDFETCH_API_KEY: ${BRANDFETCH_API_KEY:-dev_brandfetch_key}
  BRANDFETCH_BASE_URL: ${BRANDFETCH_BASE_URL:-https://api.brandfetch.io/v2}
  DISABLE_BILLING: ${DISABLE_BILLING:-True}

x-django-service: &django-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: *common-variables
  networks:
    - app_network
  restart: unless-stopped

x-app-dependencies: &app-dependencies
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3

services:
  db:
    image: postgres:18
    container_name: notipus_db
    environment:
      POSTGRES_DB: ${DB_NAME:-notipus_dev}
      POSTGRES_USER: ${DB_USER:-notipus_user}
      # Same variable and default as the app's DB_PASSWORD above, so the two
      # cannot drift apart. Postgres only reads this when it initialises an
      # empty volume: changing it later needs ALTER USER or a fresh volume.
      # CodeQL[SM02380]: Development default password - not used in production
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_123}
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and
      # refuses to start when the volume is mounted at the old
      # .../data path. Mount the parent instead.
      - postgres_data:/var/lib/postgresql
    # Loopback only: reachable from this machine (for `uv run` against the
    # container), never from the network.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  redis:
    image: redis:8-alpine
    container_name: notipus_redis
    command: >-
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:-dev_redis_password}"
    environment:
      # redis-cli reads this, so the healthcheck below can authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  migration:
    <<: *django-service
    container_name: notipus_migration
    command: ["/app/.venv/bin/python", "manage.py", "migrate"]
    depends_on: *app-dependencies
    restart: "no"  # Migration should run once and exit

  django:
    <<: *django-service
    container_name: notipus_django
    command: ["/app/.venv/bin/uvicorn", "--host", "0.0.0.0", "--port", "8080", "--workers", "3", "--lifespan", "off", "django_notipus.asgi:application"]
    ports:
      - "80:8080"
      - "8080:8080"
    depends_on:
      <<: *app-dependencies
      migration:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/app/.venv/bin/python", "manage.py", "check"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
