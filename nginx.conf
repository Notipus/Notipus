upstream django_app {
    server notipus_django:8000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    # Security headers.
    #
    # nginx's add_header does NOT merge across levels: the moment a location
    # block declares its own add_header, every header inherited from the server
    # block is dropped for that location. So each location below that sets a
    # header of its own has to repeat this list verbatim — keep them in sync.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Media files (if you add them later)
    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Health check endpoint. default_type rather than `add_header Content-Type`,
    # so this location declares no add_header of its own and keeps inheriting
    # the server-level security headers.
    location /health/ {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Django application
    location / {
        proxy_pass http://django_app;
        # Django validates the forwarded Host against ALLOWED_HOSTS, so passing
        # the client value through is the intended arrangement here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}

# Optional: Redirect HTTP to HTTPS (uncomment for production with SSL)
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$server_name$request_uri;
# }
