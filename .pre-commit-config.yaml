repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.22
  hooks:
    - id: ruff
      args: [--fix, --exit-non-zero-on-fix]
    - id: ruff-format

- repo: local
  hooks:
    - id: djlint
      name: djlint (pages)
      entry: uv run djlint --reformat
      language: system
      files: \.html\.j2$

    # Cotton components are .html, not .html.j2 — Cotton resolves <c-name> to
    # cotton/name.html and the extension is fixed.
    - id: djlint-components
      name: djlint (components)
      entry: uv run djlint --reformat
      language: system
      files: ^app/core/templates/.*\.html$
      exclude: ^app/core/templates/admin/

    - id: build-design-tokens
      name: design tokens are in sync
      entry: uv run python app/manage.py build_design_tokens --check
      language: system
      pass_filenames: false
      files: ^(app/core/design_tokens\.py|src/css/tokens\.css)$

    - id: pytest
      name: pytest
      entry: uv run pytest
      language: system
      pass_filenames: false
      always_run: true
